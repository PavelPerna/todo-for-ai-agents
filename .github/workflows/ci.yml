name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test test/lib.test.js
      - run: node -e "const m=require('module');const o=m._load;m._load=(r,...a)=>r==='vscode'?{env:{language:'en'}}:o(r,...a);require('./extension.js')"
      - run: python3 build-vsix.py
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
